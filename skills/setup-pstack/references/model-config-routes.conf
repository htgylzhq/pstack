# pstack model configuration routes
# Harness IDs follow vercel-labs/skills src/types.ts at 57217cf86ba38148a57af9e90d14a4c049558330.
# Native directories are based on src/agents.ts. Shared skill directories do not share model files.
# One route per line. Optional trailing fields can be omitted.
# IDs (comma-separated)|config directory|environment root|subdirectory under environment root|filename|legacy read file|environment policy
# Config directories and legacy files are absolute or relative to your home.
# Filename defaults to pstack-models.md. Legacy read files are used when the main file is missing.
# Environment roots default to absolute paths. "relative" also accepts relative roots.
# "profile" excludes roots equal to or above the user's home.

